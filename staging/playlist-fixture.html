<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FURLONG play-list fixture — not a live card</title>
<link rel="stylesheet" href="../css/usability.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #080c14; color: #e7eef6; font-family: system-ui, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px 14px 48px; }
  header { position: sticky; top: 0; background: #080c14; border-bottom: 1px solid #1b2636; padding: 10px 0; z-index: 2; }
  .brand { font-weight: 800; font-size: 18px; }
  .brand b { color: #34d39b; }
  .banner { margin: 12px 0; padding: 10px 12px; border: 1px solid #8a6a2c; border-radius: 10px; background: #2a2410; color: #f6e7b4; }
  button.qa { min-height: 44px; margin: 4px 0 0; font: inherit; font-weight: 700; color: #e7eef6; background: #15202f; border: 1px solid #8aa4c4; border-radius: 10px; padding: 8px 12px; }
  #qa { color: #c5d4e6; }
  .pl-toggle { display: flex; gap: 8px; }
  .pl-toggle button { min-height: 44px; font: inherit; font-weight: 800; color: #e7eef6; background: #15202f; border: 1px solid #8aa4c4; border-radius: 10px; padding: 10px 14px; }
  .pl-toggle button.on { border-color: #34d39b; background: rgba(52,211,155,.13); }
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">FUR<b>LONG</b> · Play list fixture</div></header>
<p class="banner">Synthetic fixture using the 11/09 field names. Not the live card and not a decrypted production card.</p>
<div class="pl-toggle"><button type="button" class="on" aria-pressed="true">Play list</button><button type="button" aria-pressed="false">Full card</button></div>
<button type="button" class="qa" id="feed">Show feed down</button>
<p id="qa"></p>
<div id="playlist"></div>
</div>
<script src="../js/usability.js"></script>
<script src="../js/playlist.js"></script>
<script src="playlist-fixture.js"></script>
</body>
</html>
